name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck site and worker
        run: npm run typecheck

      - name: Build
        run: npm run build:fast

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test the built site
        run: |
          npx astro preview --port 4322 &
          npx wait-on http://localhost:4322 --timeout 60000
          node scripts/verify.mjs http://localhost:4322

      - name: Upload verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-screenshots
          path: _gen/verify
          retention-days: 7
          if-no-files-found: ignore
