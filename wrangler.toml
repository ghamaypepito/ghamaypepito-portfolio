# Cloudflare Pages configuration.
#
# Deploy:  npm run build && npx wrangler pages deploy dist
#
# The contact form needs one secret set in the Pages project before it can
# deliver mail (Settings → Environment variables, or the CLI):
#
#   npx wrangler pages secret put RESEND_API_KEY --project-name ghamaypepito-portfolio
#
# Optional: bind a KV namespace called RATE_LIMIT to enable per-IP throttling.
#   npx wrangler kv namespace create ghamaypepito-ratelimit

name = "ghamaypepito-portfolio"
compatibility_date = "2026-01-15"
pages_build_output_dir = "dist"

[vars]
CONTACT_TO = "ghamaypepito@me.com"
# Replace once a domain is verified in Resend, e.g. "Portfolio <hello@ghamaypepito.com>".
CONTACT_FROM = "Portfolio <onboarding@resend.dev>"

# Uncomment and fill in the id once the namespace exists.
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "<kv-namespace-id>"
